name: Python package

on: [push,pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check version sync (__init__.py vs setup.py)
        run: |
          INIT_VERSION=$(python -c "import re; print(re.search(r\"__version__ = '([^']+)'\", open('owlapy/__init__.py').read()).group(1))")
          SETUP_VERSION=$(python -c "import re; print(re.search(r'version=\"([^\"]+)\"', open('setup.py').read()).group(1))")
          if [ "$INIT_VERSION" != "$SETUP_VERSION" ]; then
            echo "Version mismatch: owlapy/__init__.py has $INIT_VERSION, setup.py has $SETUP_VERSION"
            exit 1
          fi
          echo "Versions in sync: $INIT_VERSION"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'
          pip install dicee[dev]
      - name: Lint with ruff
        run: |
          ruff check owlapy --line-length=200
      - name: Download test data
        run: |
          wget https://files.dice-research.org/projects/Ontolearn/KGs.zip
          unzip KGs.zip
      - name: Run tests with coverage
        run: |
          pip install coverage
          coverage run -m pytest --ignore=tests/test_z_do_last_ebr_retrieval.py -p no:warnings -x
      - name: Generate coverage report
        run: |
          coverage report -m
          coverage xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false


